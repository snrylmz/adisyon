<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Maskable safe zone: 80% of canvas, centered -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="cream" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fff7f9"/>
      <stop offset="100%" stop-color="#fde2ea"/>
    </linearGradient>
    <linearGradient id="cup" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
  </defs>

  <!-- Background (full canvas for maskable) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Cupcake (centered) -->
  <g transform="translate(256 280)">
    <!-- Cup (trapezoid) -->
    <path d="M -100 0 L 100 0 L 75 110 L -75 110 Z" fill="url(#cup)" stroke="#92400e" stroke-width="3" stroke-linejoin="round"/>
    <!-- Vertical lines on cup -->
    <path d="M -60 0 L -45 110 M -20 0 L -15 110 M 20 0 L 15 110 M 60 0 L 45 110" stroke="#92400e" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

    <!-- Cream swirl -->
    <path d="M -100 0
             C -100 -55 -55 -85 0 -85
             C 55 -85 100 -55 100 0
             L 75 0
             C 75 -30 50 -55 25 -55
             C 25 -75 -25 -75 -25 -55
             C -50 -55 -75 -30 -75 0
             Z" fill="url(#cream)"/>
    <!-- Top swirl -->
    <path d="M -45 -55
             C -45 -85 -15 -100 0 -100
             C 15 -100 45 -85 45 -55"
          stroke="url(#cream)" stroke-width="40" stroke-linecap="round" fill="none"/>

    <!-- Cherry on top -->
    <circle cx="0" cy="-120" r="18" fill="#dc2626"/>
    <ellipse cx="-5" cy="-127" rx="5" ry="3" fill="#fca5a5" opacity="0.7"/>
    <!-- Stem -->
    <path d="M 0 -135 Q 8 -150 18 -148" stroke="#15803d" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Sprinkles -->
    <rect x="-60" y="-40" width="6" height="14" rx="2" fill="#fbbf24" transform="rotate(20 -57 -33)"/>
    <rect x="40" y="-30" width="6" height="14" rx="2" fill="#10b981" transform="rotate(-30 43 -23)"/>
    <rect x="-20" y="-65" width="6" height="14" rx="2" fill="#3b82f6" transform="rotate(45 -17 -58)"/>
    <rect x="25" y="-55" width="6" height="14" rx="2" fill="#a855f7" transform="rotate(-15 28 -48)"/>
  </g>
</svg>
